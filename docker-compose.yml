services:
  xlab-bash:
    image: ghcr.io/cjng20u/xlab-bash:latest
    container_name: xlab-bash
    restart: unless-stopped
    ports:
      - "8022:8022"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=8022
      - DATA_DIR=/data
    volumes:
      # Saved hosts, snippets, keyboard layouts and generated secrets live here
      - ./data:/data
    security_opt:
      - no-new-privileges:true
