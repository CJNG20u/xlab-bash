services:
  xlab-bash:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xlab-bash
    restart: unless-stopped
    ports:
      - "8022:8022"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8022
      DATA_DIR: /data
      TRUST_PROXY: 1
    volumes:
      - ./data:/data
    security_opt:
      - no-new-privileges:true
